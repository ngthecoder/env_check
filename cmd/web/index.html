<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>envcheck</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0C; --card: #111113; --border: #222226; --border-hover: #333338;
    --text: #EDEDEF; --dim: #6B6B76; --muted: #4A4A55; --ghost: #333338;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
    --python: #3776AB; --go: #00ADD8; --node: #539E43; --rust: #DEA584;
    --ruby: #CC342D; --java: #ED8B00; --system: #FBB040; --default: #8B8B8B;
    --warn: #FFD43B; --danger: #FF6B6B; --success: #539E43;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); -webkit-font-smoothing: antialiased; }

  .container { max-width: 780px; margin: 0 auto; padding: 40px 24px; }

  /* Header */
  .header { margin-bottom: 36px; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-left .icon { font-size: 13px; color: var(--go); }
  .header-left h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .header-meta { font-size: 12px; color: var(--muted); }

  .badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
  .badge-live { color: var(--success); background: rgba(83,158,67,0.1); animation: pulse 2s infinite; }
  .badge-warn { color: var(--warn); background: rgba(255,212,59,0.1); }
  .badge-danger { color: var(--danger); background: rgba(255,107,107,0.1); }
  .badge-info { padding: 2px 8px; border-radius: 4px; font-size: 11px; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  .btn { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--dim); font-size: 12px; cursor: pointer; font-family: var(--mono); transition: all 0.2s; }
  .btn:hover { border-color: var(--border-hover); color: var(--text); }
  .btn-actions { display: flex; gap: 6px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 28px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; transition: all 0.5s cubic-bezier(0.16,1,0.3,1); }
  .stat.alert { border-color: rgba(255,107,107,0.2); }
  .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 6px; }
  .stat-value { font-size: 28px; font-weight: 700; line-height: 1; }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--card); border-radius: 10px; padding: 4px; border: 1px solid #1A1A1E; }
  .tab { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-family: var(--mono); font-weight: 500; background: transparent; color: var(--muted); transition: all 0.2s; }
  .tab.active { background: var(--border); color: var(--text); }
  .tab-count { font-size: 11px; color: var(--muted); margin-left: 4px; }

  /* Search */
  .search { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; font-family: var(--mono); outline: none; margin-bottom: 20px; transition: border-color 0.2s; }
  .search:focus { border-color: var(--border-hover); }

  /* Cards */
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; cursor: pointer; position: relative; overflow: hidden; transition: all 0.3s; }
  .card:hover { border-color: var(--border-hover); }
  .card.expanded { border-color: var(--border-hover); }
  .card-accent { position: absolute; top: 0; left: 0; right: 0; height: 2px; opacity: 0.3; transition: opacity 0.3s; }
  .card.expanded .card-accent { opacity: 1; }

  .card-header { display: flex; align-items: center; justify-content: space-between; }
  .card-left { display: flex; align-items: center; gap: 12px; }
  .card-icon { font-size: 24px; }
  .card-title { font-size: 16px; font-weight: 600; text-transform: capitalize; }
  .card-subtitle { font-size: 11px; color: var(--dim); }
  .card-value { font-size: 18px; font-weight: 700; text-align: right; }
  .card-value-label { font-size: 10px; color: var(--muted); margin-top: 2px; text-align: right; }
  .card-value.big { font-size: 28px; line-height: 1; }
  .card-value-label.big { margin-top: 4px; }

  .card-body { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.16,1,0.3,1); }
  .card.expanded .card-body { max-height: 600px; }
  .card-inner { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }

  .expand-arrow { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); color: var(--ghost); font-size: 10px; transition: transform 0.3s; }
  .card.expanded .expand-arrow { transform: translateX(-50%) rotate(180deg); }

  /* Version pills */
  .versions { display: flex; flex-wrap: wrap; gap: 6px; }
  .version { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 13px; background: #1A1A1E; border: 1px solid #2A2A30; color: var(--dim); }
  .version.active { border-color: currentColor; opacity: 0.8; }
  .version .dot { font-size: 8px; }
  .version .tag { font-size: 9px; padding: 1px 4px; border-radius: 3px; }
  .tag-global { color: var(--dim); background: var(--border); }
  .tag-local { color: var(--warn); background: rgba(255,212,59,0.08); }

  /* Package rows */
  .pkg-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .pkg-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; border-radius: 6px; }
  .pkg-row.outdated { background: rgba(255,107,107,0.03); }
  .pkg-name { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pkg-ver { font-size: 12px; color: var(--dim); flex-shrink: 0; }
  .pkg-update { font-size: 10px; color: var(--danger); margin-left: 8px; flex-shrink: 0; }
  .pkg-type { font-size: 9px; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; margin-left: 8px; }

  .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 12px; }
  .meta span { color: var(--dim); }
  .meta .file { color: rgba(255,212,59,0.6); }

  .pkg-search { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12px; font-family: var(--mono); outline: none; margin-bottom: 12px; }

  /* Footer */
  .footer { margin-top: 36px; padding: 16px 0; border-top: 1px solid #151518; font-size: 11px; color: var(--ghost); display: flex; justify-content: space-between; }

  .empty { text-align: center; padding: 48px; color: var(--muted); font-size: 13px; }

  /* Scrollbar */
  .pkg-list::-webkit-scrollbar { width: 4px; }
  .pkg-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div class="container" id="app">
  <div class="header">
    <div class="header-top">
      <div class="header-left">
        <span class="icon">⌘</span>
        <h1>envcheck</h1>
        <span class="badge badge-live" id="status-badge">● LIVE</span>
      </div>
      <div class="btn-actions">
        <button class="btn" onclick="rescan()">Rescan</button>
      </div>
    </div>
    <div class="header-meta" id="meta"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button class="tab active" data-tab="runtimes" onclick="switchTab('runtimes')">Runtimes <span class="tab-count" id="tab-runtimes-count"></span></button>
    <button class="tab" data-tab="packages" onclick="switchTab('packages')">Packages <span class="tab-count" id="tab-packages-count"></span></button>
  </div>

  <input type="text" class="search" id="search" placeholder="Filter..." oninput="render()">

  <div class="cards" id="cards"></div>

  <div class="footer">
    <span id="footer-time"></span>
    <span>envcheck v1.1</span>
  </div>
</div>

<script>
const COLORS = {
  python:'#3776AB', go:'#00ADD8', node:'#539E43', rust:'#DEA584',
  ruby:'#CC342D', java:'#ED8B00', system:'#FBB040', default:'#8B8B8B'
};
const ICONS = {
  python:'🐍', go:'🔵', node:'⬢', rust:'🦀', ruby:'💎', java:'☕', system:'🍺', default:'📦'
};
const color = l => COLORS[l]||COLORS.default;
const icon = l => ICONS[l]||ICONS.default;

let data = null;
let currentTab = 'runtimes';
let expandedCards = new Set();

// ──────────────── SSE Connection ────────────────
function connect() {
  const badge = document.getElementById('status-badge');
  const es = new EventSource('/api/events');

  es.onmessage = (e) => {
    try {
      data = JSON.parse(e.data);
      render();
    } catch(err) { console.error('Parse error:', err); }
  };

  es.onopen = () => {
    badge.textContent = '● LIVE';
    badge.className = 'badge badge-live';
  };

  es.onerror = () => {
    badge.textContent = '● OFFLINE';
    badge.className = 'badge badge-danger';
    es.close();
    // Reconnect after 5s
    setTimeout(connect, 5000);
  };
}

// Fallback: poll if SSE fails
async function fetchData() {
  try {
    const res = await fetch('/api/status');
    data = await res.json();
    render();
  } catch(e) {
    console.error('Fetch error:', e);
  }
}

async function rescan() {
  const btn = document.querySelector('.btn');
  btn.textContent = 'Scanning...';
  btn.disabled = true;
  try {
    await fetch('/api/rescan', { method: 'POST' });
  } catch(e) {
    await fetchData();
  }
  btn.textContent = 'Rescan';
  btn.disabled = false;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  expandedCards.clear();
  render();
}

function toggleCard(id) {
  if (expandedCards.has(id)) expandedCards.delete(id);
  else expandedCards.add(id);
  render();
}

// ──────────────── Rendering ────────────────
function render() {
  if (!data) return;
  const q = (document.getElementById('search').value || '').toLowerCase();

  // Meta
  document.getElementById('meta').textContent = `${data.hostname} · ${data.shell} · ${data.cwd}`;

  // Stats
  const totalVer = data.tools.reduce((s,t) => s + t.installed_versions.length, 0);
  const overrides = data.tools.filter(t => t.local_version && t.local_version !== t.global_version).length;
  const pkgs = data.packages || [];
  const totalPkg = pkgs.reduce((s,p) => s + p.total_packages, 0);
  const outdated = pkgs.reduce((s,p) => s + (p.packages||[]).filter(x=>x.latest).length, 0);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">Managers</div><div class="stat-value">${data.tools.length}</div><div class="stat-sub">runtime</div></div>
    <div class="stat"><div class="stat-label">Versions</div><div class="stat-value">${totalVer}</div><div class="stat-sub">installed</div></div>
    <div class="stat"><div class="stat-label">Packages</div><div class="stat-value">${totalPkg}</div><div class="stat-sub">tracked</div></div>
    <div class="stat${outdated?' alert':''}"><div class="stat-label">${outdated?'Outdated':'Overrides'}</div><div class="stat-value" style="${outdated?'color:var(--danger)':''}">${outdated||overrides}</div><div class="stat-sub">${outdated?'need update':'local'}</div></div>
  `;

  // Tab counts
  document.getElementById('tab-runtimes-count').textContent = data.tools.length;
  document.getElementById('tab-packages-count').textContent = pkgs.length;

  // Search placeholder
  document.getElementById('search').placeholder = currentTab === 'runtimes' ? 'Filter by language or manager...' : 'Filter by manager or package name...';

  const container = document.getElementById('cards');
  let html = '';

  if (currentTab === 'runtimes') {
    const filtered = data.tools.filter(t =>
      !q || t.language.toLowerCase().includes(q) || t.manager.toLowerCase().includes(q)
    );
    html = filtered.map((t, i) => renderToolCard(t, i)).join('');
    if (!filtered.length) html = '<div class="empty">No matching runtimes found</div>';
  } else {
    const filtered = pkgs.filter(p =>
      !q || p.manager.toLowerCase().includes(q) || p.language.toLowerCase().includes(q) ||
      (p.packages||[]).some(x => x.name.toLowerCase().includes(q))
    );
    html = filtered.map((p, i) => renderPkgCard(p, i)).join('');
    if (!filtered.length) html = '<div class="empty">No matching packages found</div>';
  }

  container.innerHTML = html;

  // Footer
  document.getElementById('footer-time').textContent = `Last scan: ${new Date(data.timestamp).toLocaleString()}`;
}

function renderToolCard(t, i) {
  const c = color(t.language);
  const id = `tool-${t.manager}-${t.language}`;
  const exp = expandedCards.has(id);
  const hasLocal = t.local_version && t.local_version !== t.global_version;

  const versions = t.installed_versions.map(v => {
    const isActive = v === t.active_version;
    const isGlobal = v === t.global_version;
    const isLocal = v === t.local_version;
    return `<span class="version${isActive?' active':''}" style="${isActive?`color:${c};border-color:${c}40;background:${c}20`:''}">${isActive?'<span class="dot" style="color:'+c+'">●</span>':''}${v}${isGlobal?'<span class="tag tag-global">global</span>':''}${isLocal?'<span class="tag tag-local">local</span>':''}</span>`;
  }).join('');

  return `
    <div class="card${exp?' expanded':''}" onclick="toggleCard('${id}')">
      <div class="card-accent" style="background:linear-gradient(90deg,transparent,${c}80,transparent)"></div>
      <div class="card-header">
        <div class="card-left">
          <span class="card-icon">${icon(t.language)}</span>
          <div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span class="card-title">${t.language}</span>
              <span class="badge-info" style="color:${c};background:${c}18">${t.manager}</span>
              ${hasLocal?'<span class="badge badge-warn">LOCAL</span>':''}
            </div>
            <div class="card-subtitle">${t.installed_versions.length} version${t.installed_versions.length!==1?'s':''}</div>
          </div>
        </div>
        <div>
          <div class="card-value" style="color:${c}">${t.active_version}</div>
          <div class="card-value-label">active</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-inner">
          <div class="section-label">Installed Versions</div>
          <div class="versions">${versions}</div>
          <div class="meta">Location: <span>${t.location}</span>${t.version_file?'<br>Version file: <span class="file">'+t.version_file+'</span>':''}</div>
        </div>
      </div>
      <div class="expand-arrow">▼</div>
    </div>`;
}

function renderPkgCard(p, i) {
  const c = color(p.language);
  const id = `pkg-${p.manager}-${p.language}`;
  const exp = expandedCards.has(id);
  const outdated = (p.packages||[]).filter(x=>x.latest).length;
  const hasLocal = p.local_packages && p.local_packages.length > 0;

  const globalRows = (p.packages||[]).map(pk =>
    `<div class="pkg-row${pk.latest?' outdated':''}">
      <div style="display:flex;align-items:center;gap:8px;min-width:0">
        <span class="pkg-name">${pk.name}</span>
        ${pk.type&&pk.type!=='binary'?`<span class="pkg-type" style="color:${pk.type==='indirect'||pk.type==='dev'?'var(--dim)':c};background:${pk.type==='indirect'||pk.type==='dev'?'var(--border)':c+'15'}">${pk.type}</span>`:''}
      </div>
      <div style="display:flex;align-items:center;flex-shrink:0">
        <span class="pkg-ver">${pk.version}</span>
        ${pk.latest?`<span class="pkg-update">→ ${pk.latest}</span>`:''}
      </div>
    </div>`
  ).join('');

  const localRows = hasLocal ? (p.local_packages||[]).map(pk =>
    `<div class="pkg-row">
      <div style="display:flex;align-items:center;gap:8px;min-width:0">
        <span class="pkg-name">${pk.name}</span>
        ${pk.type?`<span class="pkg-type" style="color:${pk.type==='dev'?'var(--dim)':'var(--success)'};background:${pk.type==='dev'?'var(--border)':'rgba(83,158,67,0.08)'}">${pk.type}</span>`:''}
      </div>
      <span class="pkg-ver">${pk.version}</span>
    </div>`
  ).join('') : '';

  return `
    <div class="card${exp?' expanded':''}" onclick="toggleCard('${id}')">
      <div class="card-accent" style="background:linear-gradient(90deg,transparent,${c}80,transparent)"></div>
      <div class="card-header">
        <div class="card-left">
          <span class="card-icon">${icon(p.language)}</span>
          <div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span class="card-title" style="text-transform:none">${p.manager}</span>
              <span class="card-subtitle">v${p.manager_version}</span>
              ${outdated?`<span class="badge badge-danger">${outdated} outdated</span>`:''}
              ${hasLocal?`<span class="badge badge-warn">+${p.local_packages.length} local</span>`:''}
            </div>
            <div class="card-subtitle">${p.total_packages} package${p.total_packages!==1?'s':''}</div>
          </div>
        </div>
        <div>
          <div class="card-value big" style="color:${c}">${p.total_packages}</div>
          <div class="card-value-label big">pkgs</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-inner">
          ${(p.packages||[]).length>5?'<input type="text" class="pkg-search" placeholder="Search packages..." onclick="event.stopPropagation()" oninput="filterPkgs(this,\''+id+'\')">':''}
          <div class="section-label">${hasLocal?'Global Packages':'Packages'}</div>
          <div class="pkg-list" id="pkglist-${id}">${globalRows}</div>
          ${hasLocal?`<div style="margin-top:16px"><div class="section-label">Local Project · ${(p.local_package_file||'').split('/').pop()}</div><div class="pkg-list" id="locallist-${id}">${localRows}</div></div>`:''}
        </div>
      </div>
      <div class="expand-arrow">▼</div>
    </div>`;
}

// In-card package filtering (simple DOM toggle)
function filterPkgs(input, id) {
  const q = input.value.toLowerCase();
  const list = document.getElementById('pkglist-' + id);
  if (list) {
    list.querySelectorAll('.pkg-row').forEach(row => {
      const name = row.querySelector('.pkg-name').textContent.toLowerCase();
      row.style.display = name.includes(q) ? '' : 'none';
    });
  }
  const localList = document.getElementById('locallist-' + id);
  if (localList) {
    localList.querySelectorAll('.pkg-row').forEach(row => {
      const name = row.querySelector('.pkg-name').textContent.toLowerCase();
      row.style.display = name.includes(q) ? '' : 'none';
    });
  }
}

// ──────────────── Init ────────────────
connect();
// Fallback: if SSE doesn't deliver data within 3s, fetch directly
setTimeout(() => { if (!data) fetchData(); }, 3000);
</script>
</body>
</html>
